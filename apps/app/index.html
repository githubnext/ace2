<!DOCTYPE html>
<html lang="en" data-theme-key="ace-theme">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e3e0db" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Ace" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icon-180.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<script>
		let key = document.documentElement.dataset.themeKey;
		let theme = localStorage.getItem(key);
		document.documentElement.classList.toggle(
			"dark",
			theme === "dark"
				|| (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches),
		);
		</script>
		<style>
		body {
			background: rgb(227 224 219);
		}
		.dark body {
			background: rgb(30 30 30);
		}
		</style>
		<title>Ace</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
